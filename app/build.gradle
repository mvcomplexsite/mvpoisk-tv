plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mvpoisk.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mvpoisk.tv'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }

    signingConfigs {
        release {
            def keyStorePath = System.getenv('MVPOISK_KEYSTORE_PATH')
            if (keyStorePath) {
                storeFile file(keyStorePath)
                storePassword System.getenv('MVPOISK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MVPOISK_KEY_ALIAS')
                keyPassword System.getenv('MVPOISK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
